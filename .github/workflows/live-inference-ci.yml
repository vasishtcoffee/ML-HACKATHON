name: PathSnap final trained-model live inference tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/live-inference-ci.yml
      - pathsnap/**
      - scripts/**
      - tests/**
      - requirements/**
      - ui/**

permissions:
  contents: read

jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: 4
      OMP_NUM_THREADS: 4
    steps:
      - name: Checkout trusted models, data and project
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install live model and server requirements
        run: python -m pip install -r requirements/requirements-live-demo.txt
      - name: Run full unit and live-inference test suite
        run: python -m unittest discover -s tests -v
