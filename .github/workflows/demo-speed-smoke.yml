name: PathSnap cached development API smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - pathsnap/viterbi-tuning-speed
    paths:
      - .github/workflows/demo-speed-smoke.yml
      - pathsnap/api.py
      - tests/test_api_smoke.py
      - ui/index.html

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and API testing packages
        run: python -m pip install -r requirements/requirements-live-demo.txt
      - name: Run cache, decoder, scoring and API smoke regression cases
        run: python -m unittest discover -s tests -v
