name: PathSnap cached development API smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - pathsnap/viterbi-tuning-speed
    paths:
      - .github/workflows/demo-speed-smoke.yml
      - pathsnap/api.py
      - tests/test_api_smoke.py
      - ui/index.html

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned data requirements and API testing packages
        run: |
          python -m pip install numpy==2.2.0 pandas==2.2.3 pyarrow==22.0.0 folium==1.0.0 fastapi uvicorn httpx
      - name: Run 30 cache, decoder, scoring and API smoke regression cases
        run: python -m unittest discover -s tests -v
