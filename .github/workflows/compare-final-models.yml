name: PathSnap compare all trained models after Viterbi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model and benchmark dependencies
        run: python -m pip install -r requirements/requirements-live-demo.txt
      - name: Compare fitted models on 10 student-test trips
        run: |
          set -o pipefail
          python scripts/benchmark_final_models.py 2>&1 | tee final_comparison_run.log
      - name: Archive model comparisons and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-model-viterbi-comparison
          path: |
            experiments/final_viterbi_comparison/
            final_comparison_run.log
          if-no-files-found: warn
          retention-days: 30
