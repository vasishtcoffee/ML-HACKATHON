name: PathSnap compare all trained models after Viterbi

on:
  workflow_dispatch:
  push:
    branches:
      - pathsnap/final-model-live-inference
    paths:
      - .github/workflows/compare-final-models.yml
      - scripts/benchmark_final_models.py

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry and benchmark dependencies
        run: python -m pip install numpy==2.2.0 pandas==2.2.3 pyarrow==22.0.0 folium==1.0.0
      - name: Compare all trained score exports on 10 student-test trips
        run: |
          set -o pipefail
          python scripts/benchmark_final_models.py 2>&1 | tee final_comparison_run.log
      - name: Archive model comparisons and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-model-viterbi-comparison
          path: |
            experiments/final_viterbi_comparison/
            final_comparison_run.log
          if-no-files-found: warn
          retention-days: 30
